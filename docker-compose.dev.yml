services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Development image includes pytest and httpx.
        REQUIREMENTS_FILE: requirements-dev.txt

    container_name: personal-data-lake-api-dev

    # Development command with auto-reload enabled.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "${APP_PORT:-8000}:8000"

    environment:
      APP_NAME: ${APP_NAME:-personal-data-lake-api}
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ROOT_PATH: ${APP_ROOT_PATH:-}

      # MinIO connection used by the API.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-raw}
      MINIO_SECURE: ${MINIO_SECURE:-false}

    volumes:
      # Mount source code to enable live reload while coding.
      - ./app:/code/app

      # Mount tests and pytest configuration for local validation.
      - ./tests:/code/tests
      - ./pytest.ini:/code/pytest.ini:ro

    depends_on:
      - minio

    healthcheck:
      # Uses Python instead of curl to keep the image minimal.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: personal-data-lake-minio-dev

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}

    volumes:
      # Local development object storage data.
      - minio-data-dev:/data

volumes:
  minio-data-dev:
